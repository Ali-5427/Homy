<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shelfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3478E8"/>
      <stop offset="100%" stop-color="#1A54B8"/>
    </linearGradient>
    <linearGradient id="shelfTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F5F6F8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shelfShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- App Rounded Base Frame -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#shelfBg)" filter="url(#shelfShadow)"/>

  <!-- Shelf 1 (Top Layer) -->
  <g transform="translate(96, 120)">
    <rect width="320" height="48" rx="14" fill="url(#shelfTop)"/>
    <rect x="24" y="14" width="80" height="20" rx="6" fill="#3478E8" fill-opacity="0.25"/>
    <rect x="120" y="14" width="120" height="20" rx="6" fill="#3478E8" fill-opacity="0.15"/>
    <circle cx="280" cy="24" r="8" fill="#3478E8"/>
  </g>

  <!-- Shelf 2 (Middle Layer) -->
  <g transform="translate(96, 220)">
    <rect width="320" height="48" rx="14" fill="url(#shelfTop)"/>
    <rect x="24" y="14" width="140" height="20" rx="6" fill="#3478E8" fill-opacity="0.25"/>
    <rect x="180" y="14" width="60" height="20" rx="6" fill="#3478E8" fill-opacity="0.15"/>
    <circle cx="280" cy="24" r="8" fill="#3478E8"/>
  </g>

  <!-- Shelf 3 (Bottom Layer) -->
  <g transform="translate(96, 320)">
    <rect width="320" height="48" rx="14" fill="url(#shelfTop)"/>
    <rect x="24" y="14" width="100" height="20" rx="6" fill="#3478E8" fill-opacity="0.25"/>
    <rect x="140" y="14" width="100" height="20" rx="6" fill="#3478E8" fill-opacity="0.15"/>
    <circle cx="280" cy="24" r="8" fill="#3478E8"/>
  </g>
</svg>
